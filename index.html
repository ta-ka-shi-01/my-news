<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My News</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20252b;background:#f5f7fa}body{margin:0 auto;max-width:820px;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.7rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:white;border:1px solid #cbd3db;border-radius:20px;padding:9px 14px;cursor:pointer}.tabs button.active{background:#173a61;color:white}.item{background:white;border:1px solid #e3e7ed;border-radius:12px;padding:16px;margin:10px 0}.item a{color:#152c47;font-size:1.05rem;font-weight:650;text-decoration:none}.item a:hover{text-decoration:underline}.meta{font-size:.8rem;color:#667587;margin-bottom:8px}.priority{color:#9b4e0d;font-weight:bold}.muted{color:#687581;font-size:.85rem}#status{font-size:.85rem;color:#526174}
</style></head><body><header><h1>📰 My News</h1><span id="status">読み込み中</span></header><div class="tabs" id="tabs"></div><main id="items"></main><script>
const cats=['すべて','ゲーム業界','成人向け同人ゲーム','野球'];let active='すべて',data=[];
function draw(){const tabs=document.getElementById('tabs');tabs.replaceChildren();for(const c of cats){const b=document.createElement('button');b.textContent=c;b.className=active===c?'active':'';b.onclick=()=>{active=c;draw()};tabs.append(b)}const root=document.getElementById('items');root.replaceChildren();const items=data.filter(a=>active==='すべて'||a.category===active);if(!items.length){const p=document.createElement('p');p.textContent='表示できるニュースはありません。';root.append(p)}for(const a of items){const card=document.createElement('article');card.className='item';const meta=document.createElement('div');meta.className='meta';meta.textContent=`${a.category} · ${a.source||'出典未取得'} · ${new Date(a.published).toLocaleString('ja-JP')}`;const link=document.createElement('a');link.textContent=a.title;link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';card.append(meta,link);if(a.priority==='注目'){const p=document.createElement('div');p.className='priority';p.textContent='注目トピック';card.append(p)}root.append(card)}}
fetch('./news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('ニュースデータがありません');return r.json()}).then(j=>{data=j.articles||[];document.getElementById('status').textContent=`更新 ${new Date(j.updated_at).toLocaleString('ja-JP')}`;draw()}).catch(e=>{document.getElementById('status').textContent='取得エラー';document.getElementById('items').textContent=e.message});
</script></body></html>
