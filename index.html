<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My News</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20252b;background:#f5f7fa}
body{margin:0 auto;max-width:820px;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:1.7rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:white;border:1px solid #cbd3db;border-radius:20px;padding:9px 14px;cursor:pointer;font:inherit}.tabs button.active{background:#173a61;color:white}
.news-section{margin:30px 0}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-heading h2{font-size:1.15rem;margin:0}.more{background:white;color:#173a61;border:1px solid #cbd3db;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.item{background:white;border:1px solid #e3e7ed;border-radius:12px;padding:16px;margin:10px 0}.item a{color:#152c47;font-size:1.05rem;font-weight:650;text-decoration:none;overflow-wrap:anywhere}.item a:hover{text-decoration:underline}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:#526174;margin-bottom:8px}.category{display:inline-block;border-radius:5px;padding:3px 8px;font-weight:700;background:#e8effa;color:#244b78}.category.adult{background:#f3eafa;color:#70418c}.category.baseball{background:#e4f3eb;color:#286046}.priority{color:#9b4e0d;font-weight:bold;margin-top:8px}.empty{padding:24px 16px;background:white;border:1px dashed #cbd3db;border-radius:12px;color:#526174;line-height:1.7}#status{font-size:.85rem;color:#526174}button:focus-visible,a:focus-visible{outline:3px solid #4e84bc;outline-offset:3px}
@media(max-width:480px){body{padding:14px}.tabs{gap:6px}.tabs button{padding:9px 11px;font-size:.85rem}.item{padding:14px}}
</style>
</head>
<body>
<header><h1>📰 My News</h1><span id="status" role="status">読み込み中</span></header>
<nav class="tabs" id="tabs" aria-label="ニュースのカテゴリ"></nav>
<main id="items" aria-label="ニュース一覧"></main>
<script>
const cats=['すべて','ゲーム業界','成人向け同人ゲーム','野球'];
let active='すべて',data=[],collection={};
function selectCategory(category,focusHeading=false){
  active=category;draw();
  if(focusHeading)document.querySelector('#items h2').focus();
}
function articleCard(a){
  const card=document.createElement('article');card.className='item';
  const meta=document.createElement('div');meta.className='meta';
  const label=document.createElement('span');
  label.className='category'+(a.category==='成人向け同人ゲーム'?' adult':a.category==='野球'?' baseball':'');
  label.textContent=a.category;
  const details=document.createElement('span');details.textContent=`${a.source||'出典未取得'} · ${new Date(a.published).toLocaleString('ja-JP')}`;
  meta.append(label,details);
  if(a.retained){const retained=document.createElement('span');retained.textContent='掲載継続';meta.append(retained);}
  const link=document.createElement('a');link.textContent=a.title;link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';
  card.append(meta,link);
  if(a.priority==='注目'){
    const p=document.createElement('div');p.className='priority';p.textContent='注目トピック';card.append(p);
  }
  return card;
}
function categorySection(category,preview){
  const items=data.filter(a=>a.category===category).sort((a,b)=>Number.isFinite(a.display_order)&&Number.isFinite(b.display_order)?a.display_order-b.display_order:new Date(b.published)-new Date(a.published));
  const section=document.createElement('section');section.className='news-section';
  const heading=document.createElement('div');heading.className='section-heading';
  const title=document.createElement('h2');title.textContent=category;title.tabIndex=-1;
  title.id=`category-${cats.indexOf(category)}`;section.setAttribute('aria-labelledby',title.id);heading.append(title);
  if(preview){
    const more=document.createElement('button');more.className='more';more.textContent='もっと見る';
    more.setAttribute('aria-label',`${category}の記事をもっと見る`);
    more.onclick=()=>selectCategory(category,true);heading.append(more);
  }
  section.append(heading);
  const status=collection[category]?.status;
  if(status==='failed'||status==='partial'){
    const warning=document.createElement('p');warning.className='empty';warning.setAttribute('role','status');
    warning.textContent=status==='failed'?'収集に失敗しました。前回取得した記事がある場合は表示を継続しています。':'一部の検索に失敗しました。記事が欠けている可能性があります。';
    section.append(warning);
  }
  if(!items.length){
    const p=document.createElement('p');p.className='empty';
    p.textContent=status==='failed'||status==='partial'?'収集が完了していないため、新着記事の有無は確認できません。':status!=='ok'?'表示できる記事がありません（収集状況は未確認です）。':category==='成人向け同人ゲーム'?'成人向け同人ゲームの新着記事はありません。':'このカテゴリの新着記事はありません。';
    section.append(p);
  }
  for(const a of preview?items.slice(0,5):items)section.append(articleCard(a));
  return section;
}
function draw(){
  const tabs=document.getElementById('tabs');tabs.replaceChildren();
  for(const c of cats){
    const b=document.createElement('button');b.textContent=c;b.className=active===c?'active':'';
    b.setAttribute('aria-pressed',String(active===c));b.onclick=()=>selectCategory(c);tabs.append(b);
  }
  const root=document.getElementById('items');root.replaceChildren();
  for(const category of active==='すべて'?cats.slice(1):[active])root.append(categorySection(category,active==='すべて'));
}
fetch('./news.json',{cache:'no-store'}).then(r=>{
  if(!r.ok)throw Error('ニュースデータがありません');return r.json();
}).then(async j=>{
  // diagnostics.json is updated even if every RSS request failed and news.json was preserved.
  let diagnostics=j.diagnostics;
  try{
    const response=await fetch('./diagnostics.json',{cache:'no-store'});
    if(response.ok){
      const latest=await response.json();
      if(new Date(latest.attempted_at)>=new Date(diagnostics?.attempted_at||j.updated_at))diagnostics=latest;
    }
  }catch{/* Legacy feeds still work; an unknown status is never called a successful empty search. */}
  collection=diagnostics?.categories||{};
  data=j.articles||[];
  document.getElementById('status').textContent=`更新 ${new Date(j.updated_at).toLocaleString('ja-JP')}`;draw();
}).catch(e=>{
  document.getElementById('status').textContent='取得エラー';document.getElementById('items').textContent=e.message;
});
</script>
</body>
</html>
