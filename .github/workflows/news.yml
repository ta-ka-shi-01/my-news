name: Update news
on:
  schedule:
    - cron: '13 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector and UI
        run: |
          python -m unittest discover -s tests
          node tests/test_ui.cjs
      - name: Collect news
        id: collect
        run: python collect.py
      - name: Save diagnostics for inspection
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: diagnostics.json
          retention-days: 14
          if-no-files-found: warn
      - name: Commit feed and diagnostics
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if [ -f diagnostics.json ]; then git add diagnostics.json; fi
          git diff --cached --quiet || (git commit -m "Update news feed and diagnostics" && git push)
